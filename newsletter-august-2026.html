<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>August 2026 Newsletter | Atlanta Homes &amp; Hounds</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #2b2b2b; font-family: sans-serif; }
    .viewer-header {
      background: #1a1a1a;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .viewer-header a {
      color: #c9a96e;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    .viewer-header a:hover { text-decoration: underline; }
    .viewer-title {
      color: #fff;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    .newsletter-pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
      gap: 0;
    }
    .newsletter-pages img {
      width: 100%;
      max-width: 850px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="viewer-header">
    <a href="resources.html#newsletter">&larr; Back to Resources</a>
    <span class="viewer-title">Atlanta Homes &amp; Hounds &mdash; August 2026</span>
    <span style="width:120px;"></span>
  </div>
  <div class="newsletter-pages">
    <img src="assets/Aug_Pg1.png" alt="August 2026 Newsletter Page 1" />
    <img src="assets/Aug_Pg2.png" alt="August 2026 Newsletter Page 2" />
  </div>
</body>
</html>
