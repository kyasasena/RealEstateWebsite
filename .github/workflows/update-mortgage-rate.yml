name: Update Mortgage Rate

on:
  schedule:
    - cron: '0 14 * * 1-5'  # 9 AM EST, weekdays only
  workflow_dispatch:         # allow manual trigger

jobs:
  update-rate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Fetch and update mortgage rate
        run: |
          python3 - <<'EOF'
          import urllib.request
          import re
          import sys

          url = "https://fred.stlouisfed.org/graph/fredgraph.csv?id=MORTGAGE30US"

          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (compatible; GitHub Actions bot)"
          })

          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  content = resp.read().decode().strip()
          except Exception as e:
              print(f"ERROR fetching FRED data: {e}")
              sys.exit(1)

          lines = content.splitlines()
          print(f"Fetched {len(lines)} lines from FRED")
          print(f"Last 3 lines: {lines[-3:]}")

          def parse(row):
              parts = row.split(",")
              if len(parts) < 2:
                  raise ValueError(f"Unexpected row format: {row}")
              return parts[0].strip(), parts[1].strip()

          try:
              date2, rate2 = parse(lines[-1])
              date1, rate1 = parse(lines[-2])

              if rate2 in (".", ""):
                  print(f"Latest value missing, falling back one week")
                  date2, rate2 = date1, rate1
                  date1, rate1 = parse(lines[-3])

              rate_now = float(rate2)
              rate_prev = float(rate1)
          except Exception as e:
              print(f"ERROR parsing data: {e}")
              sys.exit(1)

          change = round(rate_now - rate_prev, 2)
          rate_str = f"{rate_now:.2f}%"
          sign = "+" if change >= 0 else ""
          trend_str = f"{sign}{change:.2f}% vs last week"
          trend_class = "trend-down" if change <= 0 else "trend-up"

          print(f"Rate: {rate_str}, Trend: {trend_str}")

          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()

          html_new = re.sub(
              r'(<p class="snapshot-value" id="mortgageRateValue">)[^<]*(</p>)',
              rf'\g<1>{rate_str}\g<2>',
              html
          )
          html_new = re.sub(
              r'(<span class="snapshot-trend )[^"]*(" id="mortgageRateTrend">)[^<]*(</span>)',
              rf'\g<1>{trend_class}\g<2>{trend_str}\g<3>',
              html_new
          )

          if html_new == html:
              print("WARNING: No regex matches found — check your HTML element IDs")
          else:
              print("HTML updated successfully")

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html_new)

          print(f"Done: {rate_str} ({trend_str})")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: update 30-yr mortgage rate"
          git push
